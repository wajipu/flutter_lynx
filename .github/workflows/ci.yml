# 免费云端编译：Dart 测试、小程序模板构建、Android APK、iOS 模拟器四条流水线。
# 产物 APK 与 iOS .app 在 Actions Artifacts 下载，替代本地手工编译。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart-test:
    name: Dart 分析与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub get
        working-directory: example
      - run: flutter test
        working-directory: example

  template-build:
    name: 小程序模板构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lynx_miniapp_template/package-lock.json
      - run: npm ci
        working-directory: lynx_miniapp_template
      - run: npm run build
        working-directory: lynx_miniapp_template

  android-build:
    name: Android 示例 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --debug
        working-directory: example
      - uses: actions/upload-artifact@v4
        with:
          name: example-apk-debug
          path: example/build/app/outputs/flutter-apk/app-debug.apk

  ios-build:
    name: iOS 示例模拟器构建
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          cache: true
      # 本地验证同款 UTF-8 环境，避免 pod/构建脚本在 C 语言环境下的编码崩溃
      - run: flutter pub get
        working-directory: example
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
      - run: flutter build ios --simulator --no-codesign
        working-directory: example
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
      - run: |
          cd example/build/ios/iphonesimulator
          zip -qry Runner.app.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: example-ios-simulator
          path: example/build/ios/iphonesimulator/Runner.app.zip
