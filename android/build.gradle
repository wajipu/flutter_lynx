group = "com.kmanager.flutter_lynx"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.kmanager.flutter_lynx"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        // Official stable 4.1 stack from lynxjs.org/guide/start/integrate-with-existing-apps.
        // Pin exact versions; Maven metadata "latest" currently points at a 4.1.0-nightly.
        implementation("org.lynxsdk.lynx:lynx:4.1.0")
        implementation("org.lynxsdk.lynx:lynx-jssdk:4.1.0")
        implementation("org.lynxsdk.lynx:lynx-trace:4.1.0")
        implementation("org.lynxsdk.lynx:primjs:4.1.1")
        // Image only; no HTTP/Log/DevTool service.
        implementation("org.lynxsdk.lynx:lynx-service-image:4.1.0")
        // `<svg>` XElement（小程序矢量图标）。注册聚合在父件 XElementBehaviors
        // （各元素 @LynxBehavior 生成代码），由 LynxPlatformView 建 LynxView 时
        // 显式 addBehaviors 挂载（上游 explorer 同款）；只引 xelement-svg 不含
        // 注册类，运行时报 9901 "svg ui not found"。POM 传递引入全部元素模块
        // 与 servalsvg 解码依赖。
        implementation("org.lynxsdk.lynx:xelement:4.1.0")
        implementation("com.facebook.fresco:fresco:2.3.0")
        implementation("com.facebook.fresco:animated-base:2.3.0")
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
