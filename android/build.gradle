group = "com.kmanager.flutter_lynx"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// ImageService 3.2.0's published POM omits its compileOnly Lynx dependency. D8 needs
// that edge when dexing the service, or ILynxImageService's default method loses
// its implementation forwarder. Apply the exact-version repair in host resolution too.
rootProject.allprojects {
    dependencies.components.withModule("org.lynxsdk.lynx:lynx-service-image") { details ->
        if (details.id.version == "3.2.0") {
            details.allVariants {
                withDependencies {
                    add("org.lynxsdk.lynx:lynx:3.2.0")
                }
            }
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.kmanager.flutter_lynx"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        // The published Lynx POM supplies its matching PrimJS 2.12.0, JS SDK and trace runtime.
        implementation("org.lynxsdk.lynx:lynx:3.2.0")
        // Official image service requires these two Fresco artifacts even for its prefetch module.
        implementation("org.lynxsdk.lynx:lynx-service-image:3.2.0")
        implementation("com.facebook.fresco:fresco:2.3.0")
        implementation("com.facebook.fresco:animated-base:2.3.0")
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
